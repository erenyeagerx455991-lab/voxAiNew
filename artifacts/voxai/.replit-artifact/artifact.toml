kind = "web"
previewPath = "/"
title = "VoxAI"
version = "1.0.0"
id = "artifacts/voxai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18565

[services.development]
run = "pnpm --filter @workspace/voxai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voxai", "run", "build" ]
publicDir = "artifacts/voxai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18565"
BASE_PATH = "/"
